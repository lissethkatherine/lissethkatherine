<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" role="img" aria-label="Lisseth Zapata, Backend Developer en formación" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    :root { --bg:#0b1b2b; --bg2:#10263b; --text:#eef2f6; --muted:#93a4b7; --line:#2a4560; --accent:#d4a84b; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f6f8fa; --bg2:#e9eef3; --text:#0f2236; --muted:#546579; --line:#b7c4d1; --accent:#9a6f10; }
    }
    .bg   { fill: url(#g); }
    .name { font: 700 62px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: var(--text); letter-spacing: -1px; }
    .role { font: 400 26px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: var(--muted); }
    .line { font: 400 18px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: var(--muted); opacity: .85; }
    .bar  { fill: var(--accent); transform-box: fill-box; transform-origin: 0 0; transform: scaleY(0); animation: grow .7s ease-out forwards; }
    .edge { stroke: var(--line); stroke-width: 1.5; fill: none; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s ease-out forwards; }
    .node { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
    .hub  { fill: var(--accent); }
    .in   { opacity: 0; animation: fade .8s ease-out forwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .9s }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes grow { to { transform: scaleY(1); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 4s ease-in-out 2s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .35; } 50% { transform: scale(2.2); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .in { opacity: 1; } .edge { stroke-dashoffset: 0; } .bar { transform: none; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--bg)"/><stop offset="1" stop-color="var(--bg2)"/></linearGradient>
    <clipPath id="r"><rect width="1200" height="240" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect class="bg" width="1200" height="240"/>
    <g transform="translate(0,-20)">
      <path class="edge" pathLength="1" d="M800 160 L900 80"/>
      <path class="edge" pathLength="1" d="M800 160 L940 190"/>
      <path class="edge" pathLength="1" d="M900 80 L1040 110"/>
      <path class="edge" pathLength="1" d="M940 190 L1040 110"/>
      <path class="edge" pathLength="1" d="M940 190 L1100 220"/>
      <path class="edge" pathLength="1" d="M1040 110 L1120 60"/>
      <path class="edge" pathLength="1" d="M1040 110 L1100 220"/>
      <g class="in d3">
        <circle class="node" cx="800" cy="160" r="7"/><circle class="node" cx="900" cy="80" r="7"/>
        <circle class="node" cx="940" cy="190" r="7"/><circle class="node" cx="1120" cy="60" r="7"/>
        <circle class="node" cx="1100" cy="220" r="7"/>
        <circle class="pulse hub" cx="1040" cy="110" r="10"/><circle class="hub" cx="1040" cy="110" r="10"/>
      </g>
    </g>
    <rect class="bar" x="64" y="52" width="4" height="136"/>
    <text class="name in d1" x="92" y="104">Lisseth Zapata</text>
    <text class="role in d2" x="92" y="146">Backend Developer en formación</text>
    <text class="line in d4" x="92" y="182">Desarrollo backend, IA aplicada y automatización de procesos.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
